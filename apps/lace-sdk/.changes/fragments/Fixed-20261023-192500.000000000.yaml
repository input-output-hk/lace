kind: Fixed
body: Cardano transaction building can use the same output for funding and collateral, so a UTxO passed to both `setUnspentOutputs` and `setCollateralUtxos` may be spent. Without an execution-unit estimate, ADA-only collateral is accepted even when its remainder is too small for a return output.
