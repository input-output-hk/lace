kind: Added
body: Passport agents can build each grant spend from their exported policy with `preparePassportGrantSpend`. It checks the spend against the grant and returns the withdrawal circuit, its arguments and the challenge to sign, for JubJub and secp256k1 grantees. `grantSpendAuthorisationArgs` turns the signature into the last arguments, and `loadPassportGrantSpendChallenges` exposes the challenge builders of every grant withdrawal.
