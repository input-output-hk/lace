body: Each package of the SDK, `@laceio/sdk`, `@laceio/cardano`, `@laceio/cardano-ledger` and `@laceio/cardano-trezor`, releases on its own version line, tagged with its name and version, and a release publishes only the packages that changed. A stable release depends on another package of the SDK by a caret range, so an app that also depends on it shares one copy within that range.
