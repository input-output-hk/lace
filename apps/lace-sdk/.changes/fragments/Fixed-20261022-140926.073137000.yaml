kind: Fixed
body: Creating a Passport account no longer fails with an expired transaction while the fee sponsor is still syncing its wallet. A `FeeSponsor` may implement an optional `ready()`, which the creation awaits before building each transaction, and `createDevSponsor` implements it, so calling `ready()` when the app loads starts its sync early.
